<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>入荷連絡</title>

<link rel="icon" href="favicon.ico">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0078d4">

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

body{
  font-family:sans-serif;
  padding:16px;
  background:#f0f2f5;
  display:flex;
  justify-content:center;
}

.card{
  background:white;
  border-radius:18px;
  padding:20px;
  box-shadow:0 6px 16px rgba(0,0,0,0.1);
  width:100%;
  max-width:480px;
}

h2{
  text-align:center;
  font-size:26px;
  margin-bottom:8px;
}

.sub{
  text-align:center;
  font-size:14px;
  color:#666;
  margin-bottom:20px;
}

button{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;

  width:100%;
  padding:18px;
  margin:10px 0;
  font-size:18px;
  border:none;
  border-radius:12px;
  color:white;

  transition:all 0.15s ease;
  box-shadow:0 4px 8px rgba(0,0,0,0.1);
  cursor:pointer;
}

button img{
  width:24px;
  height:24px;
  filter:brightness(0) invert(1);
}

.blue{ background:#0078d4; }
.orange{ background:#f39c12; }
.red{ background:#d9534f; }
.green{ background:#28a745; }
.gray{ background:#6c757d; }
.black{ background:#333; }

button:active{
  transform:translateY(2px);
  filter:brightness(0.9);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,0.5);

  align-items:center;
  justify-content:center;
  padding:16px;
}

.modal-content{
  width:100%;
  max-width:480px;
  background:white;
  border-radius:18px;
  padding:18px;
}

/* 横長カメラ */

.camera-window{
  position:relative;
  width:100%;
  height:120px;
  overflow:hidden;
  border-radius:14px;
  background:black;
  margin-bottom:12px;
}

#cameraView{
  width:100%;
  height:100%;
  object-fit:cover;
}

.scan-guide{
  position:absolute;
  inset:0;
  border:3px solid #00ff88;
  border-radius:14px;
  pointer-events:none;
  box-sizing:border-box;
}

textarea{
  width:100%;
  height:180px;
  border:1px solid #ccc;
  border-radius:10px;
  padding:10px;
  font-size:16px;
  box-sizing:border-box;
}

#status{
  text-align:center;
  color:#555;
  margin-bottom:10px;
}

</style>

<script>

let selectedMail = null;
let cameraStream = null;

function selectDept(to, cc, subject, body, dept){

  selectedMail = {
    to,
    cc,
    subject,
    body,
    dept
  };

  if(!confirm(dept + "へ入荷連絡しますか？")) return;

  if(confirm("カメラで品名を読み取りますか？")){

    startCamera();

  }else{

    sendMail(false);

  }
}

async function startCamera(){

  document.getElementById("cameraModal").style.display = "flex";

  cameraStream = await navigator.mediaDevices.getUserMedia({
    video:{
      facingMode:"environment"
    },
    audio:false
  });

  document.getElementById("cameraView").srcObject = cameraStream;
}

function stopCamera(){

  if(cameraStream){

    cameraStream.getTracks().forEach(track => track.stop());

    cameraStream = null;
  }

  document.getElementById("cameraModal").style.display = "none";
}

async function captureOCR(){

  const video = document.getElementById("cameraView");

  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  /* 表示している横長範囲だけOCR */

  const cropWidth = video.videoWidth;
  const cropHeight = video.videoHeight * 0.20;

  const cropX = 0;
  const cropY = (video.videoHeight - cropHeight) / 2;

  canvas.width = cropWidth;
  canvas.height = cropHeight;

  ctx.drawImage(
    video,
    cropX,
    cropY,
    cropWidth,
    cropHeight,
    0,
    0,
    cropWidth,
    cropHeight
  );

  document.getElementById("status").textContent =
    "OCR読み取り中です...";

  const result = await Tesseract.recognize(
    canvas,
    "jpn+eng",
    {
      logger:m=>{

        if(m.status === "recognizing text"){

          document.getElementById("status").textContent =
            "OCR読み取り中... " +
            Math.round(m.progress * 100) + "%";
        }
      }
    }
  );

  stopCamera();

  document.getElementById("ocrModal").style.display = "flex";

  document.getElementById("ocrText").value =
    result.data.text.trim();

  document.getElementById("status").textContent =
    "OCR結果を確認・編集してください。";
}

function closeOcrModal(){

  document.getElementById("ocrModal").style.display = "none";

  document.getElementById("ocrText").value = "";
}

function sendMail(useOcr){

  let body = selectedMail.body;

  if(useOcr){

    const ocrText =
      document.getElementById("ocrText").value.trim();

    if(ocrText !== ""){

      body +=
        "\n\n【読み取り内容】\n" +
        ocrText;
    }
  }

  let url = "mailto:" + selectedMail.to;

  let params = [];

  if(selectedMail.cc){

    params.push(
      "cc=" +
      encodeURIComponent(selectedMail.cc)
    );
  }

  params.push(
    "subject=" +
    encodeURIComponent(selectedMail.subject)
  );

  params.push(
    "body=" +
    encodeURIComponent(body)
  );

  url += "?" + params.join("&");

  closeOcrModal();

  location.href = url;
}

</script>

</head>

<body>

<div class="card">

  <h2>入荷連絡</h2>

  <div class="sub">
    連絡したい部署を選択してください
  </div>

  <button class="blue"
    onclick="selectDept(
      'seikan-bankin@toyodensei.co.jp',

      '板金'
    )">
    <img src="sheet_metal.png"> 板金
  </button>

  <button class="blue"
    onclick="selectDept(
      'seikan-tosou@toyodensei.co.jp',
      'seikan-gyoumu@toyodensei.co.jp',
      '塗装_購入品入荷(配信)',
      '購入品が入荷しましたので引き取りをお願いいたします。\n\n※本アドレスは送信専用です。',
      '塗装'
    )">
    <img src="paint.png"> 塗装
  </button>

  <button class="blue"
    onclick="selectDept(
      'seikan-hinsyou@toyodensei.co.jp',
      'seikan-gyoumu@toyodensei.co.jp',
      '品質保証_購入品入荷(配信)',
      '購入品が入荷しましたので引き取りをお願いいたします。\n\n※本アドレスは送信専用です。',
      '品質保証'
    )">
    <img src="quality_assurance.png"> 品質保証
  </button>

  <button class="blue"
    onclick="selectDept(
      'seikan-seisan@toyodensei.co.jp',
      'seikan-gyoumu@toyodensei.co.jp',
      '生産管理_購入品入荷(配信)',
      '購入品が入荷しましたので引き取りをお願いいたします。\n\n※本アドレスは送信専用です。',
      '生産管理'
    )">
    <img src="production_management.png"> 生産管理
  </button>

  <button class="blue"
    onclick="selectDept(
      'seikan-gyoumu@toyodensei.co.jp',
      '',
      '業務_購入品入荷(配信)',
      '購入品が入荷しましたので引き取りをお願いいたします。\n\n※本アドレスは送信専用です。',
      '業務'
    )">
    <img src="procurement.png"> 業務
  </button>

  <button class="red"
    onclick="selectDept(
      'seikan-bankin@toyodensei.co.jp,seikan-tosou@toyodensei.co.jp,seikan-hinsyou@toyodensei.co.jp,seikan-seisan@toyodensei.co.jp,seikan-gyoumu@toyodensei.co.jp',
      '',
      '全体_購入品入荷(配信)',
      '購入品が入荷しましたので引き取りをお願いいたします。\n\n※本アドレスは送信専用です。',
      '全体'
    )">
    <img src="team.png"> 全体
  </button>

  <button class="orange"
    onclick="selectDept(
      'seikan-gyoumu@toyodensei.co.jp',
      '',
      '仕込み板金完成・入荷(配信)',
      '森さん\n\n仕込み板金が完成・入荷しましたので入庫処理をお願いいたします。\n\n※本アドレスは送信専用です。',
      '仕込み板金'
    )">
    <img src="outsourcing_stock.png"> 仕込み板金
  </button>

</div>

<!-- カメラ -->

<div id="cameraModal" class="modal">

  <div class="modal-content">

    <div class="camera-window">

      <video
        id="cameraView"
        autoplay
        playsinline
      ></video>

      <div class="scan-guide"></div>

    </div>

    <button class="green"
      onclick="captureOCR()">
      この範囲を読み取る
    </button>

    <button class="black"
      onclick="stopCamera()">
      キャンセル
    </button>

  </div>

</div>

<!-- OCR -->

<div id="ocrModal" class="modal">

  <div class="modal-content">

    <div id="status"></div>

    <textarea
      id="ocrText"
      placeholder="OCR結果を確認・編集してください"
    ></textarea>

    <button class="green"
      onclick="sendMail(true)">
      OCR内容を本文に記載してメール起動
    </button>

    <button class="gray"
      onclick="sendMail(false)">
      OCR内容を記載せず定型文のみでメール起動
    </button>

    <button class="black"
      onclick="closeOcrModal()">
      キャンセル
    </button>

  </div>

</div>

</body>
</html>
